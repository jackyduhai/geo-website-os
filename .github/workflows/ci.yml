name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, json, simplexml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run security audit
        run: composer audit

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run installer
        run: php artisan geo:install --no-interaction

      - name: Run tests
        # Sequential execution only. The project does not ship brianium/paratest,
        # and the baseline is validated with the stock sequential runner;
        # do not switch to --parallel without adding and separately validating it.
        # --log-junit emits machine-readable results consumed by the count gate
        # and (for tags) by the release job; no counts are hardcoded anywhere.
        run: php artisan test --log-junit=storage/logs/junit.xml

      - name: Verify test baseline (count gate)
        # Anti-regression gate: the JUnit counts must EXACTLY match
        # scripts/audit/test-baseline.json (tests/assertions, zero failures/errors/skipped).
        # This fails CI if tests are silently deleted, not discovered, or not run.
        # When tests are intentionally added/removed: rerun the full suite, then
        # deliberately update test-baseline.json — see the file header for the runbook.
        run: php scripts/audit/verify-test-baseline.php --junit=storage/logs/junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: storage/logs/junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: Smoke test - HTTP
        run: |
          php artisan serve --port=8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/ > /dev/null
          curl -sf http://127.0.0.1:8000/geo.json > /dev/null
          curl -sf http://127.0.0.1:8000/sitemap.xml > /dev/null
          curl -sf http://127.0.0.1:8000/llms.txt > /dev/null
          curl -sf http://127.0.0.1:8000/robots.txt > /dev/null

  coverage:
    # Branch/path coverage needs Xdebug (PCOV only reports lines). Runs on Linux
    # with Xdebug's coverage mode. Source is limited to key business dirs
    # (phpunit-cov-branch.xml) so Xdebug instruments only those files; this is a
    # scoped measurement, not whole-repo coverage. Non-blocking for the release
    # gate: it produces evidence, it does not weaken the exact count gate above.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, json, simplexml
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-cov-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
            ${{ runner.os }}-php-cov-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Xdebug is loaded in coverage mode
        run: |
          php -m | grep -i xdebug
          XDEBUG_MODE=coverage php -r 'echo xdebug_info();' >/dev/null 2>&1 || true

      - name: Generate branch/path coverage
        # --path-coverage is required: without it PHPUnit reports no branch
        # metrics even with Xdebug. Text + XML + HTML are all retained.
        env:
          XDEBUG_MODE: coverage
        run: |
          php vendor/bin/phpunit -c phpunit-cov-branch.xml --path-coverage \
            --coverage-text=storage/logs/branch-coverage.txt \
            --coverage-xml=storage/logs/branch-xml \
            --coverage-html=storage/logs/branch-html

      - name: Show branch coverage summary
        run: |
          echo "===== Branch/Path coverage (scoped key dirs) ====="
          cat storage/logs/branch-coverage.txt

      - name: Upload branch coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: branch-coverage
          path: |
            storage/logs/branch-coverage.txt
            storage/logs/branch-xml
            storage/logs/branch-html
          retention-days: 30
          if-no-files-found: error

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, json, simplexml
          coverage: none

      - name: Download test results
        # Counts come from the test job's verified JUnit XML, not from hardcoded values.
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build release artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          mkdir -p release
          # Deployable package: runtime code, production vendor, the example plugin,
          # install template and legal/onboarding docs.
          cp -r app bootstrap config database plugins public resources routes storage vendor release/
          cp artisan composer.json composer.lock .env.example README.md LICENSE CHANGELOG.md \
             package.json vite.config.js release/
          # The manifest is deliberately kept OUTSIDE the zip: it records the zip checksum,
          # so embedding it inside the artifact would make the checksum self-referential.
          (cd release && zip -r -q ../geo-os-${TAG_NAME}.zip .)

      - name: Generate checksum and external manifest
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CHECKSUM="$(sha256sum geo-os-${TAG_NAME}.zip | awk '{print $1}')"
          sha256sum geo-os-${TAG_NAME}.zip > geo-os-${TAG_NAME}.zip.sha256

          # Parse the verified JUnit XML into counts (no hardcoded test numbers).
          php scripts/audit/verify-test-baseline.php \
            --junit=test-results/junit.xml --no-baseline --summary=test-summary.json
          TESTS=$(jq -r '.tests' test-summary.json)
          ASSERTIONS=$(jq -r '.assertions' test-summary.json)
          FAILURES=$(jq -r '.failures' test-summary.json)
          ERRORS=$(jq -r '.errors' test-summary.json)
          SKIPPED=$(jq -r '.skipped' test-summary.json)

          cat > release-manifest.json <<EOF
          {
            "version": "${TAG_NAME}",
            "commit": "${GITHUB_SHA}",
            "tag": "${TAG_NAME}",
            "php": "^8.4",
            "laravel": "^12.0",
            "required_extensions": ["pdo_sqlite", "mbstring", "openssl", "tokenizer", "xml", "ctype", "json"],
            "migration_state": "all migrations applied",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ci_run_id": "${GITHUB_RUN_ID}",
            "artifact_checksum": "sha256:${CHECKSUM}",
            "test_results": {
              "tests": ${TESTS},
              "assertions": ${ASSERTIONS},
              "failed": ${FAILURES},
              "errors": ${ERRORS},
              "skipped": ${SKIPPED}
            },
            "security": {
              "composer_validate": "PASS",
              "composer_audit": "PASS",
              "composer_check_platform_reqs": "PASS"
            }
          }
          EOF

          # Fail the release if the actual suite had any failure/error/skipped.
          if [ "${FAILURES}" != "0" ] || [ "${ERRORS}" != "0" ] || [ "${SKIPPED}" != "0" ]; then
            echo "Release blocked: test suite reported failures/errors/skipped."
            exit 1
          fi

      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          # Private observation window: create a non-latest prerelease DRAFT.
          # It must not be published automatically; promotion to v1.0.0 is a
          # separate, explicit decision after the observation window passes.
          draft: true
          prerelease: true
          make_latest: 'false'
          files: |
            geo-os-${{ github.ref_name }}.zip
            geo-os-${{ github.ref_name }}.zip.sha256
            release-manifest.json
