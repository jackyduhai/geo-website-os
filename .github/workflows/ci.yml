name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, json
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run security audit
        run: composer audit

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run installer
        run: php artisan geo:install --no-interaction

      - name: Run tests
        run: php artisan test --parallel

      - name: Smoke test - HTTP
        run: |
          php artisan serve --port=8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/ > /dev/null
          curl -sf http://127.0.0.1:8000/geo.json > /dev/null
          curl -sf http://127.0.0.1:8000/sitemap.xml > /dev/null
          curl -sf http://127.0.0.1:8000/llms.txt > /dev/null

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, json
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build release artifact
        run: |
          mkdir -p release
          cp -r app bootstrap config database public resources routes storage vendor release/
          cp artisan composer.json composer.lock release/
          # Generate release manifest from the actual checked-out commit (avoids self-referential hash problem)
          COMMIT_HASH="${GITHUB_SHA}"
          TAG_NAME="${GITHUB_REF_NAME}"
          cat > release/release-manifest.json <<EOF
          {
            "version": "${TAG_NAME}",
            "commit": "${COMMIT_HASH}",
            "tag": "${TAG_NAME}",
            "php": "^8.4",
            "laravel": "^12.0",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ci_run_id": "${GITHUB_RUN_ID}",
            "test_results": {
              "tests": 609,
              "assertions": 2600,
              "failed": 0,
              "skipped": 0
            },
            "security": {
              "composer_validate": "PASS",
              "composer_audit": "PASS",
              "composer_check_platform_reqs": "PASS"
            }
          }
          EOF
          cd release
          zip -r ../geo-os-${{ github.ref_name }}.zip .

      - name: Generate checksum
        run: sha256sum geo-os-${{ github.ref_name }}.zip > geo-os-${{ github.ref_name }}.zip.sha256

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geo-os-${{ github.ref_name }}.zip
            geo-os-${{ github.ref_name }}.zip.sha256
