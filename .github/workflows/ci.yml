name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, json, simplexml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run security audit
        run: composer audit

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Run installer
        run: php artisan geo:install --no-interaction

      - name: Run tests
        # Sequential execution only. The project does not ship brianium/paratest,
        # and the baseline is validated with the stock sequential runner;
        # do not switch to --parallel without adding and separately validating it.
        # --log-junit emits machine-readable results consumed by the count gate
        # and (for tags) by the release job; no counts are hardcoded anywhere.
        run: php artisan test --log-junit=storage/logs/junit.xml

      - name: Verify test baseline (count gate)
        # Anti-regression gate: the JUnit counts must EXACTLY match
        # scripts/audit/test-baseline.json (tests/assertions, zero failures/errors/skipped).
        # This fails CI if tests are silently deleted, not discovered, or not run.
        # When tests are intentionally added/removed: rerun the full suite, then
        # deliberately update test-baseline.json — see the file header for the runbook.
        run: php scripts/audit/verify-test-baseline.php --junit=storage/logs/junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: storage/logs/junit.xml
          retention-days: 7
          if-no-files-found: error

      - name: Smoke test - HTTP
        run: |
          php artisan serve --port=8000 &
          sleep 3
          curl -sf http://127.0.0.1:8000/ > /dev/null
          curl -sf http://127.0.0.1:8000/geo.json > /dev/null
          curl -sf http://127.0.0.1:8000/sitemap.xml > /dev/null
          curl -sf http://127.0.0.1:8000/llms.txt > /dev/null
          curl -sf http://127.0.0.1:8000/robots.txt > /dev/null

  pgsql:
    # PostgreSQL 16 兼容性门禁。
    #
    # 覆盖授权单 V1.4 · B 的四个必测项：
    #   1) 空库迁移（migrate）—— 61→62 个迁移在 PostgreSQL 上必须能全量跑通；
    #   2) 安装器（geo:install）—— 安装流程必须在 PG 上可用；
    #   3) 核心回归（PgsqlCore testsuite）—— 纯逻辑 + 跨库结构一致性 + 真实并发
    #      + 核心业务在 PG 上的行为必须与 SQLite 一致；
    #   4) 结构断言（DatabaseStructureParityTest）—— 唯一约束 / 外键 / 表存在性
    #      的跨库一致性由该用例锁定。
    #
    # 失败诊断：迁移或安装失败时，后续 step 仍会执行「Collect PostgreSQL
    # diagnostics」，打印实际生效的连接配置、迁移记录数与表清单，避免只看到
    # 一句红叉而无从下手。
    name: PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo_os_ci
          POSTGRES_PASSWORD: geo_os_ci_pwd
          POSTGRES_DB: geo_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # 这些变量通过 job 级 env 注入到进程环境。phpunit.pgsql.xml 里的同名 <env>
    # 均声明 force="false"，PHPUnit 11 不会用文件里的本地默认值覆盖已存在的
    # 环境变量，因此这里无需额外改写配置文件。
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: geo_os_ci
      DB_USERNAME: geo_os_ci
      DB_PASSWORD: geo_os_ci_pwd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, openssl, tokenizer, xml, ctype, json, simplexml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-pg-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-
            ${{ runner.os }}-php-pg-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run security audit
        run: composer audit

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Verify effective database connection
        # 打印实际生效的配置，避免「以为连的是 PG 其实连的是 SQLite」这类误判。
        run: |
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            printf(
              "default=%s driver=%s host=%s port=%s database=%s user=%s%s",
              config("database.default"),
              config("database.connections.pgsql.driver"),
              config("database.connections.pgsql.host"),
              config("database.connections.pgsql.port"),
              config("database.connections.pgsql.database"),
              config("database.connections.pgsql.username"),
              PHP_EOL
            );
            if (config("database.default") !== "pgsql") { exit(1); }
          '

      - name: Ensure application role can create objects in public schema
        # postgres:16 镜像会把 POSTGRES_USER 同时建成库属主与超级用户，
        # 正常情况下 public schema 的 CREATE 权限是现成的。
        # 这里仍显式授予并打印结果：一旦镜像行为或账号配置变化，
        # 后续步骤会以一句 "permission denied for schema public" (42501) 失败，
        # 极难定位；本步骤把该失败模式前置成一行明确输出。
        run: |
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $user = config("database.connections.pgsql.username");
            $ident = chr(34) . str_replace(chr(34), chr(34) . chr(34), $user) . chr(34);
            Illuminate\Support\Facades\DB::statement("GRANT ALL ON SCHEMA public TO " . $ident);
            Illuminate\Support\Facades\DB::statement("ALTER SCHEMA public OWNER TO " . $ident);
            printf("public schema granted to %s%s", $user, PHP_EOL);
          '

      - name: Migrate empty database
        run: php artisan migrate --force

      - name: Run installer
        run: php artisan geo:install --no-interaction

      - name: Run PostgreSQL core regression
        # PgsqlCore testsuite：见 phpunit.pgsql.xml 文件头注释（选它的理由与口径）。
        # --log-junit 产出机器可读结果，供下一步零失败校验与 artifact 使用。
        run: |
          php vendor/bin/phpunit -c phpunit.pgsql.xml \
            --testsuite PgsqlCore \
            --log-junit=storage/logs/junit-pgsql.xml

      - name: Verify PostgreSQL regression results (zero-failure gate)
        # PostgreSQL 门禁口径：**不允许** failures / errors / skipped。
        # 计数基线不与 SQLite 的 test-baseline.json 比对 —— 两者是不同的测试子集，
        # 直接比对会把「子集差异」误判为「测试丢失」，因此用下限而不是相等。
        #
        # --min-tests=174（2026-10-28）：补上「零失败但没有测试」的漏洞。
        # 只判 failures/errors/skipped 全为 0 时，一个什么都没跑的空 XML 也能通过，
        # 门禁会给出假绿。下限取实测值，不做降额留白：
        #   phpunit -c phpunit.pgsql.xml --testsuite PgsqlCore --list-tests  → 174 条
        #   （tests/Unit 全目录 + Concurrency 全目录 + 9 个守护文件；
        #     JUnit 用例数与之一致，RouteBindingGuardTest 实测 24 方法 / 24 testcase）
        # 语义：新增用例照常通过，删除、改名漏收集、路径写错导致少收，都会红；
        # 确有意的缩减必须先改这个数字，属于显式决策而不是静默流失。
        run: |
          php scripts/audit/verify-test-baseline.php \
            --junit=storage/logs/junit-pgsql.xml \
            --no-baseline --min-tests=174 \
            --summary=storage/logs/pgsql-summary.json
          php -r '
            $s = json_decode(file_get_contents("storage/logs/pgsql-summary.json"), true);
            printf(
              "pgsql core regression: tests=%s assertions=%s failures=%s errors=%s skipped=%s%s",
              $s["tests"], $s["assertions"], $s["failures"], $s["errors"], $s["skipped"], PHP_EOL
            );
            if ($s["failures"] != 0 || $s["errors"] != 0 || $s["skipped"] != 0) {
              fwrite(STDERR, "PostgreSQL regression gate failed." . PHP_EOL);
              exit(1);
            }
          '

      - name: Upload PostgreSQL test results
        uses: actions/upload-artifact@v4
        with:
          name: pgsql-test-results
          path: storage/logs/junit-pgsql.xml
          retention-days: 7
          if-no-files-found: error

      - name: Collect PostgreSQL diagnostics
        # always()：迁移 / 安装 / 回归任一步失败都要留下现场，而不是只留一句红叉。
        if: always()
        run: |
          echo "===== effective config ====="
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            print_r(config("database.connections.pgsql"));
          ' || true
          echo "===== migration status ====="
          php artisan migrate:status || true
          echo "===== tables ====="
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $rows = Illuminate\Support\Facades\DB::select(
              "SELECT table_name FROM information_schema.tables
               WHERE table_schema = current_schema() ORDER BY table_name"
            );
            foreach ($rows as $r) { echo "  ", $r->table_name, PHP_EOL; }
          ' || true

  # ── 覆盖率作业的迁移说明（2026-10-28，V1.4 远端验收）─────────────────────
  # coverage 作业已从本文件移出，改由 .github/workflows/coverage.yml 独立承担。
  # 迁移原因（有远端实测证据，不是主观取舍）：
  #   run 40659217487 中，coverage 作业补齐 .env/APP_KEY 后进入真正的
  #   Generate branch/path coverage，跑到 job 级 timeout-minutes 45 上限被终止
  #   （注解原文：The job has exceeded the maximum execution time of 45m0s），
  #   作业结论是 cancelled，而 cancelled 不被 continue-on-error 吸收，
  #   会把整条 workflow 一起拖成 cancelled。也就是说这个作业留在主链上时，
  #   既不产出覆盖率，又让每次推送都没有绿灯可用。
  # 迁移口径：
  #   · 覆盖率仍是测量项，仍用 --path-coverage 与 phpunit-cov-branch.xml，
  #     测量范围与判定口径未改，不是删除门禁；
  #   · 它从来不是发布门禁（原本就是 continue-on-error），发布门禁是 test 的
  #     精确计数门禁与 pgsql 的零失败门禁，这两项留在本文件；
  #   · 独立后可用 workflow_dispatch 与定时触发，预算放宽到 180 分钟，
  #     不再占用每次推送的关键路径。
  # 首次实测结论待 coverage.yml 在默认分支可用后补齐（本轮无远端运行证据）。

  release:
    # pgsql 纳入发布门禁：PostgreSQL 作为正式支持数据库时，它的门禁失败
    # 不得放行发布产物。此前只依赖 test，会出现在 PG 红的情况下照旧构建发布。
    needs: [test, pgsql]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # 最小权限声明（2026-10-28，阶段 B-1）。
    # 仓库默认 workflow token 是只读，发布作业要创建 Release 并上传资产就必须显式提权。
    # 提权只在本作业生效，test / pgsql 仍是默认只读，没有为了发布方便给全局放开。
    #
    # contents: write —— 创建 Release、上传 zip / sha256 / manifest。
    # actions: read   —— 下载 test 作业的 test-results artifact。
    #   这一条容易漏：一旦写了 permissions，未列出的作用域一律变成 none，
    #   actions/download-artifact 会因 actions: none 直接 403。
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, openssl, tokenizer, xml, ctype, json, simplexml
          coverage: none

      - name: Download test results
        # Counts come from the test job's verified JUnit XML, not from hardcoded values.
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build release artifact
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          mkdir -p release
          # Deployable package: runtime code, production vendor, the example plugin,
          # install template and legal/onboarding docs.
          cp -r app bootstrap config database plugins public resources routes storage vendor release/
          cp artisan composer.json composer.lock .env.example README.md LICENSE CHANGELOG.md \
             package.json vite.config.js release/
          # The manifest is deliberately kept OUTSIDE the zip: it records the zip checksum,
          # so embedding it inside the artifact would make the checksum self-referential.
          (cd release && zip -r -q ../geo-os-${TAG_NAME}.zip .)

      - name: Generate checksum and external manifest
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CHECKSUM="$(sha256sum geo-os-${TAG_NAME}.zip | awk '{print $1}')"
          sha256sum geo-os-${TAG_NAME}.zip > geo-os-${TAG_NAME}.zip.sha256

          # Parse the verified JUnit XML into counts (no hardcoded test numbers).
          php scripts/audit/verify-test-baseline.php \
            --junit=test-results/junit.xml --no-baseline --summary=test-summary.json
          TESTS=$(jq -r '.tests' test-summary.json)
          ASSERTIONS=$(jq -r '.assertions' test-summary.json)
          FAILURES=$(jq -r '.failures' test-summary.json)
          ERRORS=$(jq -r '.errors' test-summary.json)
          SKIPPED=$(jq -r '.skipped' test-summary.json)

          cat > release-manifest.json <<EOF
          {
            "version": "${TAG_NAME}",
            "commit": "${GITHUB_SHA}",
            "tag": "${TAG_NAME}",
            "php": "^8.4",
            "laravel": "^12.0",
            "required_extensions": ["pdo_sqlite", "mbstring", "openssl", "tokenizer", "xml", "ctype", "json"],
            "migration_state": "all migrations applied",
            "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "ci_run_id": "${GITHUB_RUN_ID}",
            "artifact_checksum": "sha256:${CHECKSUM}",
            "test_results": {
              "tests": ${TESTS},
              "assertions": ${ASSERTIONS},
              "failed": ${FAILURES},
              "errors": ${ERRORS},
              "skipped": ${SKIPPED}
            },
            "security": {
              "composer_validate": "PASS",
              "composer_audit": "PASS",
              "composer_check_platform_reqs": "PASS"
            }
          }
          EOF

          # Fail the release if the actual suite had any failure/error/skipped.
          if [ "${FAILURES}" != "0" ] || [ "${ERRORS}" != "0" ] || [ "${SKIPPED}" != "0" ]; then
            echo "Release blocked: test suite reported failures/errors/skipped."
            exit 1
          fi

      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          # Private observation window: create a non-latest prerelease DRAFT.
          # It must not be published automatically; promotion to v1.0.0 is a
          # separate, explicit decision after the observation window passes.
          draft: true
          prerelease: true
          make_latest: 'false'
          files: |
            geo-os-${{ github.ref_name }}.zip
            geo-os-${{ github.ref_name }}.zip.sha256
            release-manifest.json
